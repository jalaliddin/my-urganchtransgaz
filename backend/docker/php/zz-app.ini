; Document uploads are capped at the app level by the `documents.max_upload_kb`
; setting (Settings page, default 10MB) — these are a hard ceiling comfortably
; above that so an admin raising the app-level limit doesn't also need an
; image rebuild.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

; Standard production OPcache: compiled bytecode cached in shared memory,
; source files never re-checked against disk (safe because deploys rebuild
; the image rather than editing files in place).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
