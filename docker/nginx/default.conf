# The single public entry point: routes /api (and the few other
# backend-owned paths) to the Laravel app, everything else to the Vue SPA.
# Both upstreams are other containers on the compose network, addressed by
# service name — Docker's embedded DNS resolves them.

server {
    listen 80;
    server_name my.urtg.uz;

    client_max_body_size 25M;

    # Needed once you add certbot for Let's Encrypt (webroot method) — see
    # the "HTTPS" section in the root README's Docker deployment notes.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once you have a certificate (see README), add a second server block on
# 443 with `ssl_certificate`/`ssl_certificate_key` and the same two
# `location` blocks above, and turn this one into an HTTP→HTTPS redirect
# (keep the acme-challenge location on plain :80 for renewals either way).
